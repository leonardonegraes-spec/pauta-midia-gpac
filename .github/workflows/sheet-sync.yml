name: Sincronização da planilha de autorizações de mídia

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 07:00 no horário de Brasília
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions, para testar

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sheet-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node sync-autorizacoes.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

name: Envio diário da pauta por e-mail

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 08:00 no horário de Brasília
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions, para testar

jobs:
  send-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node send-digest.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEAM_EMAILS: ${{ secrets.TEAM_EMAILS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

name: Envio diário da pauta por e-mail

on:
  schedule:
    # 11:37 UTC = 08:37 no horário de Brasília. Minuto "torto" de propósito: o GitHub
    # Actions atrasa bastante quando muita gente agenda em horário redondo (:00, :15,
    # :30, :45) — um minuto incomum como 37 tende a enfrentar menos fila.
    - cron: "37 11 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions, para testar

jobs:
  send-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node send-digest.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEAM_EMAILS: ${{ secrets.TEAM_EMAILS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_SCHEDULE: ${{ github.event.schedule }}

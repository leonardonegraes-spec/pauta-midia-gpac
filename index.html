<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pauta de Mídia — Time Ademicon</title>
<style>
  :root {
    color-scheme: light;
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --surface2: #F4F5EF;
    --surface3: #ECEEE5;
    --border: #E4E6DC;
    --border-soft: #EDEFE7;
    --border-strong: #CBCFBE;
    --accent: #52690E;
    --accent-fill: #AADC32;
    --accent-fill-hover: #96C428;
    --accent-ink: #17210A;
    --text: #21241B;
    --text2: #666B58;
    --text3: #9BA089;
    --danger: #B23A2F;
    --warn: #8C6208;
    --ok: #1F7A3B;
    --info: #2160C4;
    --font: Arial, Helvetica, sans-serif;
    --bella: #C97F1E;
    --eduardo: #3568D4;
    --anna: #C43F80;
    --leonardo: #128F89;
    --rejane: #7A54C4;
    --time: #5B6470;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-fill); color: var(--accent-ink); }
  button, select, input, textarea { font-family: var(--font); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- Shell ---------- */
  .app { max-width: 1400px; margin: 0 auto; padding: 16px 28px 60px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 10px; text-transform: uppercase;
  }
  .topbar h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-fill); flex: none; box-shadow: 0 0 0 3px rgba(170,220,50,.25); }
  .topbar .subtitle { color: var(--text2); font-size: 12px; margin-top: 3px; text-transform: uppercase; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap;
  }
  .btn:hover { background: var(--surface3); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent-fill); color: var(--accent-ink); border-color: var(--accent-fill); }
  .btn.primary:hover { background: var(--accent-fill-hover); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .status-banner {
    display: none; align-items: center; gap: 8px; background: var(--surface2);
    border: 1px solid var(--warn); color: var(--warn); border-radius: 7px;
    padding: 8px 14px; font-size: 12.5px; margin-bottom: 16px;
  }
  .status-banner.show { display: flex; }

  /* ---------- Month nav ---------- */
  .monthbar { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .monthbar .nav-btn {
    width: 30px; height: 30px; border-radius: 7px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .monthbar .nav-btn:hover { background: var(--surface3); color: var(--text); }
  .monthbar .label { font-size: 16px; font-weight: 700; min-width: 190px; text-align: center; text-transform: uppercase; }
  .monthbar .today-btn { margin-left: 4px; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--surface); border-radius: 10px;
    padding: 14px 16px; border-top: 3px solid var(--border);
    box-shadow: 0 1px 2px rgba(30,32,20,.05), 0 1px 8px rgba(30,32,20,.04);
  }
  .stat .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
  .stat.total { border-top-color: var(--info); }
  .stat.total .n { color: var(--info); }
  .stat.grand-total { border-top-color: var(--accent); }
  .stat.grand-total .n { color: var(--accent); }
  .stat.unassigned { border-top-color: var(--warn); }
  .stat.unassigned .n { color: var(--warn); }
  .stat.late { border-top-color: var(--danger); }
  .stat.late .n { color: var(--danger); }
  .stat.done { border-top-color: var(--ok); }
  .stat.done .n { color: var(--ok); }

  /* ---------- Team filter row ---------- */
  .team-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .team-row .label { color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-right: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 12px 5px 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    color: var(--text2); transition: all .12s; text-transform: uppercase;
  }
  .chip .avatar { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #FFFFFF; flex: none; }
  .chip .count { color: var(--text3); font-variant-numeric: tabular-nums; }
  .chip.active { color: var(--text); border-color: var(--border-strong); background: var(--surface3); }
  .chip.active .count { color: var(--text2); }
  .chip:hover { border-color: var(--border-strong); }
  .chip.unassigned .avatar { background: var(--surface3); border: 1px dashed var(--text3); }

  /* ---------- Multi-select de responsáveis ---------- */
  .resp-checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .resp-check {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text);
    cursor: pointer; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 12px 6px 8px; user-select: none; text-transform: uppercase;
  }
  .resp-check:hover { border-color: var(--border-strong); }
  .resp-check input { margin: 0; }
  .resp-check .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .avatar-stack { display: flex; gap: 3px; flex: none; }

  /* ---------- Filter bar ---------- */
  .filter-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .filter-bar input[type="text"] {
    flex: 1; min-width: 220px; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13px;
  }
  .filter-bar select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; flex: none;
  }

  /* ---------- View switch ---------- */
  .view-switch { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .view-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
    border-radius: 20px; padding: 6px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .view-btn:hover { border-color: var(--border-strong); }
  .view-btn.active { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }

  /* ---------- Pauta em lista ---------- */
  .pauta-list {
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .pauta-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .12s;
  }
  .pauta-row:last-child { border-bottom: none; }
  .pauta-row:hover { background: var(--surface2); }
  .pauta-row .mini-avatar {
    width: 20px; height: 20px; border-radius: 50%; font-size: 9px; font-weight: 700; color: #FFFFFF;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .pauta-row .mini-avatar.none { background: transparent; border: 1px dashed var(--text3); }
  .pauta-row .pl-date {
    flex: none; width: 78px; font-size: 12px; font-weight: 700; color: var(--text2); line-height: 1.3;
  }
  .pauta-row .pl-date.late { color: var(--danger); }
  .pauta-row .pl-created { color: var(--text3); font-weight: 400; font-size: 10px; margin-top: 3px; }
  .pauta-row .pl-main { flex: 1; min-width: 0; }
  .pauta-row .pl-title { font-weight: 700; font-size: 13.5px; color: var(--text); }
  .pauta-row .pl-meta {
    display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 11.5px;
    color: var(--text3); flex-wrap: wrap;
  }
  .pauta-row .pl-plano { color: var(--accent); font-weight: 700; }
  .pauta-row .pl-pracas {
    color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px;
  }
  .pauta-row .pl-resp {
    flex: none; font-size: 12px; color: var(--text2); font-weight: 600; max-width: 150px; text-align: right;
    text-transform: uppercase;
  }

  /* ---------- Calendar grid ---------- */
  .cal-wrap { overflow-x: auto; }
  .cal {
    display: grid; grid-template-columns: repeat(7, minmax(148px, 1fr)); gap: 8px; min-width: 1050px;
  }
  .weekday {
    text-align: center; color: var(--text3); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; padding-bottom: 4px;
  }
  .weekday.weekend { opacity: .65; }

  .day-cell {
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px;
    min-height: 132px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
    transition: background .12s, border-color .12s, box-shadow .12s;
    box-shadow: 0 1px 2px rgba(30,32,20,.04);
  }
  .day-cell.outside { background: transparent; border-color: var(--border-soft); opacity: .4; box-shadow: none; }
  .day-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .day-cell.drag-over { border-color: var(--accent); background: var(--surface3); }

  .day-head { display: flex; align-items: center; justify-content: space-between; }
  .day-num { font-size: 13px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }
  .day-cell.today .day-num { color: var(--accent); }
  .day-add {
    width: 18px; height: 18px; border-radius: 5px; border: none; background: transparent; color: var(--text3);
    cursor: pointer; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s;
  }
  .day-cell:hover .day-add { opacity: 1; }
  .day-add:hover { background: var(--surface3); color: var(--accent); }

  .day-cards { display: flex; flex-direction: column; gap: 5px; flex: 1; }

  .card {
    background: var(--surface2); border: 1px solid var(--border-soft); border-left: 3px solid var(--text3);
    border-radius: 6px; padding: 6px 8px; cursor: grab; font-size: 12px;
  }
  .card:active { cursor: grabbing; }
  .card:hover { background: var(--surface3); border-left-color: inherit; box-shadow: 0 2px 6px rgba(30,32,20,.08); }
  .card.dragging { opacity: .4; }
  .card .card-title { font-weight: 700; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .card .card-meta { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
  .card .mini-avatar {
    width: 15px; height: 15px; border-radius: 50%; font-size: 8px; font-weight: 700; color: #FFFFFF;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .card .mini-avatar.none { background: transparent; border: 1px dashed var(--text3); }
  .card .plano-tag { color: var(--text2); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .status-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-left: auto; }
  .status-pendente { background: var(--text3); }
  .status-producao { background: var(--info); }
  .status-concluido { background: var(--ok); }
  .card .status-badge {
    flex: none; margin-left: auto; font-size: 9px; font-weight: 700; letter-spacing: .2px;
    padding: 2px 6px; border-radius: 8px; white-space: nowrap; line-height: 1.5;
  }
  .status-badge.badge-pendente { background: var(--surface3); color: var(--text2); }
  .status-badge.badge-producao { background: #DCEAFB; color: var(--info); }
  .status-badge.badge-concluido { background: #DCF3E2; color: var(--ok); }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(40,42,30,.32); display: none;
    align-items: flex-start; justify-content: center; padding: 6vh 20px; z-index: 100; overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 480px; padding: 22px; box-shadow: 0 20px 50px rgba(30,32,20,.16);
  }
  .modal h2 { font-size: 16px; margin: 0 0 16px; display: flex; align-items: center; justify-content: space-between; }
  .modal h2 .close { cursor: pointer; color: var(--text3); font-size: 18px; border: none; background: none; }
  .modal h2 .close:hover { color: var(--text); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; font-weight: 700; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 9px 10px; font-size: 13.5px;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .praca-preview { font-size: 11.5px; color: var(--text2); margin-top: 5px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
  .modal-actions .right { display: flex; gap: 8px; }

  /* ---------- Reference drawer ---------- */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(40,42,30,.28); display: none; z-index: 90;
  }
  .drawer-overlay.show { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 380px; max-width: 90vw;
    background: var(--surface); border-left: 1px solid var(--border); z-index: 91;
    padding: 22px; overflow-y: auto; transform: translateX(100%); transition: transform .18s ease;
    box-shadow: -8px 0 30px rgba(30,32,20,.08);
  }
  .drawer-overlay.show .drawer { transform: translateX(0); }
  .drawer h2 { font-size: 15px; margin: 0 0 4px; text-transform: uppercase; }
  .drawer .sub { color: var(--text2); font-size: 12px; margin-bottom: 16px; }
  .empty-note { text-align: center; color: var(--text3); font-size: 12px; padding: 30px 0; }

  /* ---------- Reference modal (praças por campanha) ---------- */
  .modal.wide { max-width: 760px; }
  #refSearch {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 16px;
  }
  #refSearch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ref-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;
    max-height: 56vh; overflow-y: auto; padding-right: 2px;
  }
  .ref-card { background: var(--surface2); border: 1px solid var(--border-soft); border-radius: 10px; padding: 14px 16px; }
  .ref-card .ref-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .ref-card .ref-nome { font-weight: 700; color: var(--accent); font-size: 13.5px; }
  .ref-card .ref-count-wrap { display: flex; align-items: center; gap: 8px; flex: none; }
  .ref-card .ref-count { color: var(--text3); font-size: 11px; white-space: nowrap; }
  .ref-card .ref-del {
    cursor: pointer; color: var(--text3); background: none; border: none; font-size: 13px;
    line-height: 1; padding: 0;
  }
  .ref-card .ref-del:hover { color: var(--danger); }
  .praca-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .praca-tag {
    background: var(--surface3); border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 11px; font-size: 11.5px; color: var(--text2); line-height: 1.4;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .praca-tag.match { border-color: var(--accent); color: var(--text); }
  .praca-tag .rm {
    cursor: pointer; color: var(--text3); font-weight: 700; background: none; border: none;
    padding: 0; font-size: inherit; font-family: inherit; line-height: 1;
  }
  .praca-tag .rm:hover { color: var(--danger); }
  .ref-add-row { display: flex; gap: 6px; margin-top: 10px; }
  .ref-add-row input {
    flex: 1; min-width: 0; background: var(--surface3); border: 1px solid var(--border); color: var(--text);
    border-radius: 20px; padding: 5px 12px; font-size: 11.5px;
  }
  .ref-add-btn {
    flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface3);
    border: 1px solid var(--border); color: var(--text2); cursor: pointer; font-size: 14px; line-height: 1;
  }
  .ref-add-btn:hover { color: var(--accent); border-color: var(--border-strong); }
  .ref-new-card {
    border: 1px dashed var(--border-strong); border-radius: 10px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px; justify-content: center;
  }
  .ref-new-card .ref-nome { color: var(--text2); font-size: 12.5px; font-weight: 700; }
  .ref-new-card input {
    width: 100%; background: var(--surface3); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 8px 10px; font-size: 12.5px;
  }

  /* ---------- Person drawer ---------- */
  .person-stats { display: flex; gap: 8px; }
  .ps {
    flex: 1; background: var(--surface2); border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 8px 10px; font-size: 10.5px; color: var(--text2); text-transform: uppercase; letter-spacing: .3px;
  }
  .ps b { display: block; font-size: 18px; color: var(--text); font-weight: 700; text-transform: none; letter-spacing: 0; }
  .ps.late-c b { color: var(--danger); }
  .ps.done-c b { color: var(--ok); }
  .person-row {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border-soft);
    cursor: pointer;
  }
  .person-row:last-child { border-bottom: none; }
  .person-row:hover .pr-title { color: var(--accent); }
  .pr-date {
    flex: none; width: 66px; font-size: 11px; color: var(--text2); font-weight: 700;
    padding-top: 1px; line-height: 1.35;
  }
  .pr-date.late { color: var(--danger); }
  .pr-main { flex: 1; min-width: 0; }
  .pr-title { font-weight: 700; font-size: 13px; color: var(--text); transition: color .12s; }
  .pr-meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 11px; color: var(--text3); flex-wrap: wrap; }
  .pr-plano { color: var(--accent); font-weight: 700; }
  .pr-pracas { color: var(--text2); }
  .pr-status { flex: none; display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); white-space: nowrap; }

  /* ---------- Autorizações de mídia (pendências, planilha externa somente leitura) ---------- */
  .auth-view { display: flex; flex-direction: column; }
  .auth-filter-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .auth-filter-bar input[type="text"] {
    flex: 1; min-width: 220px; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13px;
  }
  .au-sync-note { color: var(--text3); font-size: 11px; margin-bottom: 10px; text-align: right; }
  .auth-list {
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .auth-row {
    display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
    border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .12s;
  }
  .auth-row:last-child { border-bottom: none; }
  .auth-row:hover { background: var(--surface2); }
  .auth-row.late { background: #FBF1EF; }
  .auth-row.late:hover { background: #F7E9E6; }
  .au-main { flex: 1; min-width: 0; }
  .au-title { font-weight: 700; font-size: 13.5px; color: var(--accent); }
  .au-meta {
    display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 11.5px;
    color: var(--text3); flex-wrap: wrap;
  }
  .au-prazo { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .au-prazo.late-text { color: var(--danger); font-weight: 700; }

    { id: "seed-05", date: "2026-09-17", title: "Atualização Aeroportos 2026",    planoKey: "",               pracas: ["Aeroportos - Nacional"], responsavel: "Rejane", status: "pendente", notas: "" },
    { id: "seed-06", date: "2026-09-18", title: "Entrega Verão Avião Banner",     planoKey: "verao",          pracas: null,          responsavel: "Bella",     status: "pendente", notas: "" },
    { id: "seed-07", date: "2026-09-21", title: "Flamengo Outubro",               planoKey: "",               pracas: [],            responsavel: "Eduardo",   status: "pendente", notas: "" },
    { id: "seed-08", date: "2026-09-22", title: "Plano SP I (Refazer)",           planoKey: "sp1",            pracas: null,          responsavel: "Anna",      status: "pendente", notas: "" },
    { id: "seed-09", date: "2026-09-23", title: "Plano Santa Catarina",           planoKey: "sc",             pracas: null,          responsavel: "Leonardo",  status: "pendente", notas: "" },
    { id: "seed-10", date: "2026-09-24", title: "Plano Palmas e Manaus",          planoKey: "palmas-manaus",  pracas: null,          responsavel: "Rejane",    status: "pendente", notas: "" },
    { id: "seed-11", date: "2026-09-28", title: "Plano Mato Grosso",              planoKey: "mt",             pracas: null,          responsavel: "Bella",     status: "pendente", notas: "" },
    { id: "seed-12", date: "2026-09-29", title: "Plano Litoral Paraná",           planoKey: "pr",             pracas: null,          responsavel: "Eduardo",   status: "pendente", notas: "" },
    { id: "seed-13", date: "2026-10-02", title: "Plano Verão 26/27 (Final)",      planoKey: "verao",          pracas: null,          responsavel: "Anna",      status: "pendente", notas: "" }
  ];

  var WEEKDAYS = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  var MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayIso(){ return iso(new Date()); }
  function parseIso(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function initials(name){ if(!name) return "—"; var parts = name.trim().split(/\s+/); return parts.length>1 ? (parts[0][0]+parts[1][0]).toUpperCase() : name.slice(0,2).toUpperCase(); }
  function teamColor(name){ var t = TEAM.filter(function(m){return m.key===name;})[0]; return t ? t.color : null; }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  // Campanha agora é texto livre. Docs antigos guardam uma chave fixa (ex: "sp1") em
  // planoKey; entradas novas guardam o texto digitado direto. Resolve os dois casos.
  function findPlanoByName(name){
    var n = (name||"").trim().toLowerCase();
    if (!n) return null;
    var keys = Object.keys(state.planos);
    for (var i=0;i<keys.length;i++){ if (state.planos[keys[i]].nome.toLowerCase() === n) return state.planos[keys[i]]; }
    return null;
  }
  function campanhaLabel(d){
    if (!d.planoKey) return "";
    return state.planos[d.planoKey] ? state.planos[d.planoKey].nome : d.planoKey;
  }
  function campanhaPracas(d){
    if (d.pracas && d.pracas.length) return d.pracas;
    if (!d.planoKey) return [];
    if (state.planos[d.planoKey]) return state.planos[d.planoKey].pracas;
    var m = findPlanoByName(d.planoKey);
    return m ? m.pracas : [];
  }

  // Responsáveis agora é uma lista (pode ter mais de uma pessoa). Docs antigos só
  // tinham "responsavel" (string única) — continuam funcionando normalmente.
  function getResponsaveis(d){
    if (d.responsaveis && d.responsaveis.length) return d.responsaveis;
    if (d.responsavel) return [d.responsavel];
    return [];
  }
  function renderAvatars(resp){
    if (!resp.length) return '<div class="mini-avatar none"></div>';
    return resp.map(function(name){
      return '<div class="mini-avatar" style="background:'+teamColor(name)+'" title="'+escapeHtml(name)+'">'+initials(name)+'</div>';
    }).join("");
  }

  // ---------------- State ----------------
  var state = {
    year: 2026, month: 8, // September 2026 (0-indexed)
    demandas: [],
    planos: SEED_PLANOS,
    activeFilters: new Set(),
    statusFilter: "",
    searchQuery: "",
    editingId: null,
    dbAvailable: false,
    view: "calendar",
    autorizacoes: [],
    authSearch: "",
    authSyncInfo: null
  };

  // ---------------- Rendering ----------------
  function computeWeeks(year, month){
    var first = new Date(year, month, 1);
    var last = new Date(year, month+1, 0);
    function sundayOf(d){ var wd = d.getDay(); var r = new Date(d); r.setDate(d.getDate()-wd); return r; }
    var start = sundayOf(first);
    var end = sundayOf(last); end.setDate(end.getDate()+6);
    var weeks = []; var cur = new Date(start);
    while (cur <= end) {
      var week = [];
      for (var i=0;i<7;i++){ week.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
      weeks.push(week);
    }
    return weeks;
  }

  function renderMonthLabel(){
    document.getElementById("monthLabel").textContent = MONTHS[state.month] + " de " + state.year;
  }

  function renderWeekdayRow(){
    var el = document.getElementById("weekdayRow");
    el.innerHTML = WEEKDAYS.map(function(w,i){
      return '<div class="weekday'+(i===0||i===6?' weekend':'')+'">'+w+'</div>';
    }).join("");
  }

  function demandasFor(dateIso){
    return state.demandas.filter(function(d){ return d.date === dateIso; });
  }

  function passesFilter(d){
    var resp = getResponsaveis(d);
    if (state.activeFilters.size > 0) {
      var matched = resp.length ? resp.some(function(r){ return state.activeFilters.has(r); }) : state.activeFilters.has("__none__");
      if (!matched) return false;
    }
    if (state.statusFilter && d.status !== state.statusFilter) return false;
    if (state.searchQuery) {
      var q = state.searchQuery.trim().toLowerCase();
      var hay = [d.title, campanhaLabel(d), campanhaPracas(d).join(" "), resp.join(" ")].join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function renderCard(d){
    var resp = getResponsaveis(d);
    var color = resp.length ? teamColor(resp[0]) : null;
    var pracas = campanhaPracas(d);
    var planoLabel = campanhaLabel(d) || (pracas.length ? pracas.slice(0,2).join(", ") + (pracas.length>2 ? " +"+(pracas.length-2) : "") : "");
    var avatarHtml = '<div class="avatar-stack">'+renderAvatars(resp)+'</div>';
    var statusBadgeClass = d.status === "concluido" ? "badge-concluido" : (d.status === "producao" ? "badge-producao" : "badge-pendente");
    var statusText = d.status === "concluido" ? "Concluído" : (d.status === "producao" ? "Em produção" : "Pendente");
    return '<div class="card" draggable="true" data-id="'+d.id+'" style="border-left-color:'+(color||"var(--text3)")+'">'
      + '<div class="card-title">'+escapeHtml(d.title)+'</div>'
      + '<div class="card-meta">'+avatarHtml+'<div class="plano-tag">'+escapeHtml(planoLabel)+'</div><div class="status-badge '+statusBadgeClass+'">'+statusText+'</div></div>'
      + '</div>';
  }

  function renderGrid(){
    renderMonthLabel();
    var weeks = computeWeeks(state.year, state.month);
    var grid = document.getElementById("calGrid");
    var today = todayIso();
    var html = "";
    weeks.forEach(function(week){
      week.forEach(function(date){
        var di = iso(date);
        var outside = date.getMonth() !== state.month;
        var items = demandasFor(di).filter(passesFilter).sort(function(a,b){ return (a.title||"").localeCompare(b.title||""); });
        var cellClass = "day-cell" + (outside ? " outside" : "") + (di === today ? " today" : "");
        html += '<div class="'+cellClass+'" data-date="'+di+'">'
          + '<div class="day-head"><span class="day-num">'+date.getDate()+'</span><button class="day-add" data-date="'+di+'" title="Nova pauta">+</button></div>'
          + '<div class="day-cards">' + items.map(renderCard).join("") + '</div>'
          + '</div>';
      });
    });
    grid.innerHTML = html;
    attachGridEvents();
  }

  function renderTeamRow(){
    var el = document.getElementById("teamRow");
    // Contagem histórica (todos os jobs que já existem, não só o mês em exibição).
    var counts = {};
    state.demandas.forEach(function(d){
      var resp = getResponsaveis(d);
      if (!resp.length) { counts["__none__"] = (counts["__none__"]||0)+1; return; }
      resp.forEach(function(k){ counts[k] = (counts[k]||0)+1; });
    });
    var ranked = TEAM.slice().sort(function(a,b){ return (counts[b.key]||0) - (counts[a.key]||0); });
    var html = '<span class="label">Time</span>';
    ranked.forEach(function(m){
      var active = state.activeFilters.has(m.key) ? " active" : "";
      html += '<div class="chip'+active+'" data-filter="'+m.key+'">'
        + '<span class="avatar" style="background:'+m.color+'">'+initials(m.key)+'</span>'
        + m.key + ' <span class="count">'+(counts[m.key]||0)+'</span></div>';
    });
    var activeNone = state.activeFilters.has("__none__") ? " active" : "";
    html += '<div class="chip unassigned'+activeNone+'" data-filter="__none__"><span class="avatar"></span>Não atribuído <span class="count">'+(counts["__none__"]||0)+'</span></div>';
    if (state.activeFilters.size) html += '<button class="btn small ghost" id="btnClearFilter">Limpar filtro</button>';
    el.innerHTML = html;
    el.querySelectorAll(".chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        openPersonDrawer(chip.getAttribute("data-filter"));
      });
    });
    var clearBtn = document.getElementById("btnClearFilter");
    if (clearBtn) clearBtn.addEventListener("click", function(e){ e.stopPropagation(); state.activeFilters.clear(); renderTeamRow(); renderGrid(); renderList(); });
  }

  function renderStats(){
    var monthKey = state.year + "-" + pad(state.month+1);
    var monthDemandas = state.demandas.filter(function(d){ return d.date.slice(0,7) === monthKey; });
    var today = todayIso();
    var unassigned = monthDemandas.filter(function(d){ return !getResponsaveis(d).length; }).length;
    var late = monthDemandas.filter(function(d){ return d.date < today && d.status !== "concluido"; }).length;
    var done = monthDemandas.filter(function(d){ return d.status === "concluido"; }).length;
    document.getElementById("statTotal").textContent = monthDemandas.length;
    document.getElementById("statGrandTotal").textContent = state.demandas.length;
    document.getElementById("statUnassigned").textContent = unassigned;
    document.getElementById("statLate").textContent = late;
    document.getElementById("statDone").textContent = done;
  }

  function renderPautaRow(d){
    var today = todayIso();
    var late = d.date < today && d.status !== "concluido";
    var resp = getResponsaveis(d);
    var planoLabel = campanhaLabel(d);
    var pracas = campanhaPracas(d).join(", ");
    var statusBadgeClass = d.status === "concluido" ? "badge-concluido" : (d.status === "producao" ? "badge-producao" : "badge-pendente");
    var statusText = d.status === "concluido" ? "Concluído" : (d.status === "producao" ? "Em produção" : "Pendente");
    var avatarHtml = '<div class="avatar-stack">'+renderAvatars(resp)+'</div>';
    var createdHtml = d.createdAt ? '<div class="pl-created">desde '+formatCreatedAt(d.createdAt)+'</div>' : '';
    return '<div class="pauta-row" data-id="'+d.id+'">'
      + '<div class="pl-date'+(late?" late":"")+'">'+formatDateLong(d.date)+createdHtml+'</div>'
      + avatarHtml
      + '<div class="pl-main">'
        + '<div class="pl-title">'+escapeHtml(d.title)+'</div>'
        + '<div class="pl-meta">'+(planoLabel ? '<span class="pl-plano">'+escapeHtml(planoLabel)+'</span>' : '')+(pracas ? '<span class="pl-pracas">'+escapeHtml(pracas)+'</span>' : '')+'</div>'

  // ---------------- Autorizações de mídia — pendências (planilha externa, somente leitura) ----------------
  // Espelho de uma planilha de controle de autorização de mídia (PI/AP/RM/Checking), sincronizada 1x/dia
  // por um script fora daqui (sheet-sync). Sistema separado da pauta: coleção própria (autorizacoes), sem
  // edição pela plataforma, sem entrar no calendário/estatísticas. Só mostra o que ainda está pendente.
  function parseVeiculacaoInicio(v){
    if (!v) return null;
    var m = String(v).match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (!m) return null;
    return m[3] + "-" + m[2] + "-" + m[1];
  }

  function authPendencias(a){
    var pend = [];
    if (!a.piRecebido) pend.push("pi");
    if (!a.apAssinada) pend.push("ap");
    if (!a.dataEnvioMaterialRealizada) pend.push("material");
    return pend;
  }

  function authDeadlineInfo(a){
    var pend = authPendencias(a);
    var candidates = [];
    if (pend.indexOf("pi") !== -1 || pend.indexOf("ap") !== -1) {
      var vi = parseVeiculacaoInicio(a.veiculacao);
      if (vi) candidates.push({ ref: vi, textLate: "Veiculação começou em", textFuture: "Veiculação começa em" });
    }
    if (pend.indexOf("material") !== -1 && a.dataEnvioMaterialPlanejada) {
      candidates.push({ ref: a.dataEnvioMaterialPlanejada, textLate: "Material deveria ter sido enviado em", textFuture: "Material a enviar até" });
    }
    if (!candidates.length) return null;
    candidates.sort(function(x,y){ return x.ref.localeCompare(y.ref); });
    var c = candidates[0];
    var today = todayIso();
    var late = c.ref < today;
    var days = Math.abs(Math.round((parseIso(today) - parseIso(c.ref)) / 86400000));
    return { ref: c.ref, late: late, days: days, textLate: c.textLate, textFuture: c.textFuture };
  }

  function authPrazoText(info){
    if (!info) return "";
    var dateBR = formatCreatedAt(info.ref);
    if (info.late) return info.textLate + " " + dateBR + " — " + info.days + " dia" + (info.days === 1 ? "" : "s") + " atrasado";
    return info.textFuture + " " + dateBR + " — dentro do prazo";
  }

  function authTitle(a){
    if (a.campanha && a.campanha.trim() && a.campanha.trim() !== "-") return a.campanha;
    return a.veiculo || a.praca || "Autorização";
  }

  function renderAuthRow(a, pend, info){
    var badgeLabels = { pi: "PI pendente", ap: "AP pendente", material: "Material pendente" };
    var badges = (info && info.late) ? '<span class="au-badge late">Atrasado</span>' : "";
    badges += pend.map(function(k){ return '<span class="au-badge pending">'+badgeLabels[k]+'</span>'; }).join("");
    var metaParts = [];
    if (a.praca) metaParts.push('<span>'+escapeHtml(a.praca)+'</span>');
    if (a.veiculo) metaParts.push('<span>'+escapeHtml(a.veiculo)+'</span>');
    var prazoHtml = info ? '<div class="au-prazo'+(info.late ? " late-text" : "")+'">'+escapeHtml(authPrazoText(info))+'</div>' : "";
    return '<div class="auth-row'+(info && info.late ? " late" : "")+'" data-id="'+a.id+'">'
      + '<div class="au-main">'
        + '<div class="au-title">'+escapeHtml(authTitle(a))+'</div>'
        + '<div class="au-meta">'+metaParts.join("")+'</div>'
        + prazoHtml
      + '</div>'
      + '<div class="au-badges">'+badges+'</div>'
      + '</div>';
  }

  function authPassesFilter(a){
    if (!state.authSearch) return true;
    var q = state.authSearch.trim().toLowerCase();
    var hay = [a.cliente, a.campanha, a.praca, a.veiculo, a.contato].join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function renderAuthList(){
    var monthStart = state.year + "-" + pad(state.month+1) + "-01";
    var monthEnd = state.year + "-" + pad(state.month+1) + "-" + pad(new Date(state.year, state.month+1, 0).getDate());
    var items = state.autorizacoes
      .map(function(a){ return { a: a, pend: authPendencias(a), info: authDeadlineInfo(a) }; })
      // Só entram pendências com prazo dentro do mês em exibição (nada antes do início nem depois do fim do mês).
      .filter(function(x){ return x.pend.length > 0 && x.info && x.info.ref >= monthStart && x.info.ref <= monthEnd; })
      .filter(function(x){ return authPassesFilter(x.a); })
      .sort(function(x,y){
        var xl = (x.info && x.info.late) ? 0 : 1, yl = (y.info && y.info.late) ? 0 : 1;
        if (xl !== yl) return xl - yl;
        var xr = x.info ? x.info.ref : "9999-99-99", yr = y.info ? y.info.ref : "9999-99-99";
        return xr.localeCompare(yr);
      });
    var el = document.getElementById("authList");
    el.innerHTML = items.length ? items.map(function(x){ return renderAuthRow(x.a, x.pend, x.info); }).join("")
      : '<div class="empty-note">'+(state.authSearch ? "Nenhuma pendência encontrada com esse filtro." : "Nenhuma pendência neste mês.")+'</div>';
    el.querySelectorAll(".auth-row").forEach(function(row){
      row.addEventListener("click", function(){ openAuthDetail(row.getAttribute("data-id")); });
    });
    var note = document.getElementById("authSyncNote");
    note.textContent = state.authSyncInfo
      ? ("Última sincronização: " + new Date(state.authSyncInfo.lastSyncAt).toLocaleString("pt-BR") + " · " + items.length + " pendências neste mês (de " + state.authSyncInfo.count + " registros na planilha)")
      : "Ainda sem sincronização.";
  }

  function openAuthDetail(id){
    var a = state.autorizacoes.filter(function(x){ return x.id === id; })[0];
    if (!a) return;
    var rows = [
      ["Cliente", a.cliente], ["Centro de custo", a.centroCusto], ["Campanha", a.campanha], ["Praça", a.praca],
      ["Veículo", a.veiculo], ["Contato", a.contato], ["Formato", a.formato], ["Veiculação", a.veiculacao],
      ["Publi", a.publi], ["Nº PI", a.numPi], ["PI enviado", formatCreatedAt(a.piEnviado)], ["PI recebido", formatCreatedAt(a.piRecebido)],
      ["N° AP", a.numAp], ["AP enviada", formatCreatedAt(a.apEnviada)], ["AP assinada", formatCreatedAt(a.apAssinada)],
      ["RM enviada", formatCreatedAt(a.rmEnviada)], ["Envio material (planejado)", formatCreatedAt(a.dataEnvioMaterialPlanejada)],
      ["Envio material (realizado)", formatCreatedAt(a.dataEnvioMaterialRealizada)], ["PP", a.pp],
      ["Status de material", a.statusMaterial], ["Solicitação checking", formatCreatedAt(a.solicitacaoChecking)],
      ["Checking confirmado", formatCreatedAt(a.checkingConfirmado)], ["Checking final", formatCreatedAt(a.checkingFinal)],
      ["Financeiro", a.financeiro], ["Observação", a.observacao]
    ];
    var body = '<dl class="auth-detail">' + rows.filter(function(r){ return r[1]; }).map(function(r){
      return '<dt>'+escapeHtml(r[0])+'</dt><dd>'+escapeHtml(String(r[1]))+'</dd>';
    }).join("") + '</dl>';
    openDrawer(authTitle(a), a.cliente ? "Cliente: "+a.cliente : "", body);
  }

  // ---------------- Drag & drop ----------------
  var dragId = null;
  function attachGridEvents(){
    document.querySelectorAll(".card").forEach(function(card){
      card.addEventListener("dragstart", function(e){
        dragId = card.getAttribute("data-id");
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
      card.addEventListener("click", function(){ openModal(card.getAttribute("data-id")); });
    });

      cell.addEventListener("dragover", function(e){ e.preventDefault(); cell.classList.add("drag-over"); });
      cell.addEventListener("dragleave", function(){ cell.classList.remove("drag-over"); });
      cell.addEventListener("drop", function(e){
        e.preventDefault(); cell.classList.remove("drag-over");
        if (!dragId) return;
        var newDate = cell.getAttribute("data-date");
        moveDemanda(dragId, newDate);
        dragId = null;
      });
    });
    document.querySelectorAll(".day-add").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        openModal(null, btn.getAttribute("data-date"));
      });
    });
  }

  function moveDemanda(id, newDate){
    var d = state.demandas.filter(function(x){ return x.id === id; })[0];
    if (!d || d.date === newDate) return;
    d.date = newDate;
    renderAll();
    persist(id, { date: newDate });
  }

  var overlay = document.getElementById("modalOverlay");

  function populateSelects(){

    var respChecks = document.getElementById("respChecks");
    respChecks.innerHTML = TEAM.map(function(m){
      return '<label class="resp-check"><input type="checkbox" value="'+m.key+'" /><span class="dot" style="background:'+m.color+'"></span>'+m.key+'</label>';
    }).join("");

  function setRespChecks(resp){
    document.querySelectorAll('#respChecks input[type="checkbox"]').forEach(function(cb){
      cb.checked = resp.indexOf(cb.value) !== -1;
    });
  }
  function getRespChecks(){
    return Array.from(document.querySelectorAll('#respChecks input[type="checkbox"]:checked')).map(function(cb){ return cb.value; });
  }

  function formatCreatedAt(s){
    if (!s) return "";
    var d = parseIso(s.slice(0,10));
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function openModal(id, presetDate){
    populateSelects();
    state.editingId = id;
    var isNew = !id;
    document.getElementById("modalTitleLabel").textContent = isNew ? "Nova pauta" : "Editar pauta";
    document.getElementById("btnDelete").style.display = isNew ? "none" : "inline-block";
    if (isNew) {
      document.getElementById("fTitle").value = "";
      document.getElementById("fCreatedAt").value = todayIso();
      document.getElementById("fDate").value = presetDate || todayIso();
      document.getElementById("fStatus").value = "pendente";
      document.getElementById("fPlano").value = "";
      document.getElementById("fPracas").value = "";
      setRespChecks([]);
      document.getElementById("fNotas").value = "";
    } else {
      var d = state.demandas.filter(function(x){ return x.id === id; })[0];
      if (!d) return;
      document.getElementById("fTitle").value = d.title || "";
      document.getElementById("fCreatedAt").value = (d.createdAt ? d.createdAt.slice(0,10) : todayIso());
      document.getElementById("fDate").value = d.date || todayIso();
      document.getElementById("fStatus").value = d.status || "pendente";
      document.getElementById("fPlano").value = campanhaLabel(d);
      document.getElementById("fPracas").value = campanhaPracas(d).join(", ");
      setRespChecks(getResponsaveis(d));
      document.getElementById("fNotas").value = d.notas || "";

    overlay.classList.add("show");
    document.getElementById("fTitle").focus();
  }

    var match = findPlanoByName(this.value);
    if (match) document.getElementById("fPracas").value = match.pracas.join(", ");

  document.getElementById("btnCancel").addEventListener("click", closeModal);

  document.getElementById("btnSave").addEventListener("click", function(){
    var title = document.getElementById("fTitle").value.trim();
    var date = document.getElementById("fDate").value;
    if (!title || !date) { document.getElementById("fTitle").focus(); return; }
    var pracasRaw = document.getElementById("fPracas").value.trim();
    var createdAt = document.getElementById("fCreatedAt").value || todayIso();
    var payload = {
      title: title,
      date: date,
      createdAt: createdAt,
      status: document.getElementById("fStatus").value,
      planoKey: document.getElementById("fPlano").value.trim(),
      pracas: pracasRaw ? pracasRaw.split(",").map(function(s){ return s.trim(); }).filter(Boolean) : [],
      responsaveis: getRespChecks(),
      responsavel: getRespChecks()[0] || "",
      notas: document.getElementById("fNotas").value.trim()
    };
    if (state.editingId) {
      var d = state.demandas.filter(function(x){ return x.id === state.editingId; })[0];
      Object.assign(d, payload);
      persist(state.editingId, payload);
    } else {
      var id = "d-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
      var newDoc = Object.assign({ id: id }, payload);
      state.demandas.push(newDoc);
      persistCreate(id, payload);
    }
    closeModal();
    renderAll();
  });

  document.getElementById("btnDelete").addEventListener("click", function(){

    closeModal();
    renderAll();
    persistDelete(id);

  // ---------------- Generic side drawer ----------------
  var drawerOverlay = document.getElementById("drawerOverlay");
  function openDrawer(title, sub, bodyHtml){

    document.getElementById("drawerSub").textContent = sub;
    document.getElementById("drawerBody").innerHTML = bodyHtml;
    drawerOverlay.classList.add("show");

  function closeDrawer(){ drawerOverlay.classList.remove("show"); }
  drawerOverlay.addEventListener("click", function(e){ if (e.target === drawerOverlay) closeDrawer(); });

  // ---------------- Praças por campanha (modal, editável) ----------------
  var refOverlay = document.getElementById("refOverlay");
  var refSearch = document.getElementById("refSearch");
  var refQuery = "";

  function slugify(s){
    var out = (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
    return out || "campanha";
  }
  function uniquePlanoKey(nome){
    var base = slugify(nome), key = base, n = 2;
    while (state.planos[key]) { key = base + "-" + n; n++; }
    return key;
  }
  function persistPlano(key){
    if (!state.dbAvailable) return;
    setDoc(doc(fdb, "planos", key), state.planos[key]).catch(function(e){ console.error(e); });
  }
  function persistDeletePlano(key){
    if (!state.dbAvailable) return;
    deleteDoc(doc(fdb, "planos", key)).catch(function(e){ console.error(e); });
  }

  function renderRefGrid(){
    var q = refQuery.trim().toLowerCase();
    var html = Object.keys(state.planos).map(function(k){
      var p = state.planos[k];
      var nameMatch = p.nome.toLowerCase().indexOf(q) !== -1;
      if (q && !nameMatch && !p.pracas.some(function(pr){ return pr.toLowerCase().indexOf(q) !== -1; })) return "";
      var tags = p.pracas.map(function(pr, i){
        var hit = q && !nameMatch && pr.toLowerCase().indexOf(q) !== -1;
        return '<span class="praca-tag'+(hit?' match':'')+'">'+escapeHtml(pr)+'<button type="button" class="rm" data-rm-plano="'+k+'" data-rm-idx="'+i+'" title="Remover" aria-label="Remover '+escapeHtml(pr)+'">✕</button></span>';
      }).join("");
      return '<div class="ref-card">'
        + '<div class="ref-head"><span class="ref-nome">'+escapeHtml(p.nome)+'</span>'
          + '<span class="ref-count-wrap"><span class="ref-count">'+p.pracas.length+' praça'+(p.pracas.length===1?'':'s')+'</span>'
          + '<button class="ref-del" data-del-plano="'+k+'" title="Excluir campanha">🗑</button></span></div>'
        + '<div class="praca-tags">'+(tags || '<span class="praca-tag" style="opacity:.5">sem praças cadastradas</span>')+'</div>'
        + '<div class="ref-add-row"><input type="text" placeholder="Adicionar praça..." data-add-plano="'+k+'" />'
          + '<button type="button" class="ref-add-btn" data-add-btn-plano="'+k+'" title="Adicionar" aria-label="Adicionar praça">+</button></div>'
        + '</div>';
    }).join("");
    html += '<div class="ref-new-card"><span class="ref-nome">+ Nova campanha</span>'
      + '<input type="text" id="refNewNome" placeholder="Nome da campanha" />'
      + '<button class="btn small primary" id="refNewCreate">Criar</button></div>';
    document.getElementById("refGrid").innerHTML = html || '<div class="empty-note">Nenhuma campanha ou praça encontrada.</div>';
    attachRefGridEvents();
  }

  function attachRefGridEvents(){
    document.querySelectorAll(".praca-tag .rm").forEach(function(el){
      el.addEventListener("click", function(){
        var key = el.getAttribute("data-rm-plano"), idx = +el.getAttribute("data-rm-idx");
        state.planos[key].pracas.splice(idx, 1);
        persistPlano(key);
        renderRefGrid();
        renderAll();
      });
    });
    document.querySelectorAll("[data-del-plano]").forEach(function(el){
      el.addEventListener("click", function(){
        var key = el.getAttribute("data-del-plano");
        if (!confirm('Excluir a campanha "'+state.planos[key].nome+'"? Pautas que a usam mantêm o nome, mas perdem a lista de praças automática.')) return;
        delete state.planos[key];
        persistDeletePlano(key);
        renderRefGrid();
        renderAll();
      });
    });
    function addPracaFromInput(inputEl){
      var val = inputEl.value.trim();
      if (!val) { inputEl.focus(); return; }

      persistPlano(key);
      renderRefGrid();
      renderAll();

      });

    document.querySelectorAll("[data-add-btn-plano]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-add-btn-plano");
        addPracaFromInput(document.querySelector('[data-add-plano="'+key+'"]'));
      });
    });
    var createBtn = document.getElementById("refNewCreate");
    if (createBtn) createBtn.addEventListener("click", function(){

  // ---------------- Person view ----------------
  function formatDateLong(d){
    var date = parseIso(d);
    var s = date.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" }).replace(/\./g, "");
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function personDemandas(key){
    return state.demandas
      .filter(function(d){
        var resp = getResponsaveis(d);
        return resp.length ? resp.indexOf(key) !== -1 : key === "__none__";
      })
      .sort(function(a,b){ return a.date.localeCompare(b.date); });

  function renderPersonRow(d){
    var today = todayIso();
    var late = d.date < today && d.status !== "concluido";
    var planoLabel = campanhaLabel(d);
    var pracasArr = campanhaPracas(d);
    var pracas = pracasArr.length ? pracasArr.join(", ") : "—";
    var statusClass = d.status === "concluido" ? "status-concluido" : (d.status === "producao" ? "status-producao" : "status-pendente");
    var statusLabel = d.status === "concluido" ? "Concluído" : (d.status === "producao" ? "Em produção" : "Pendente");
    return '<div class="person-row" data-id="'+d.id+'">'
      + '<div class="pr-date'+(late?" late":"")+'">'+formatDateLong(d.date)+'</div>'
      + '<div class="pr-main">'
        + '<div class="pr-title">'+escapeHtml(d.title)+'</div>'
        + '<div class="pr-meta">'+(planoLabel ? '<span class="pr-plano">'+escapeHtml(planoLabel)+'</span>' : '')+'<span class="pr-pracas">'+escapeHtml(pracas)+'</span></div>'
      + '</div>'
      + '<div class="pr-status"><span class="status-dot '+statusClass+'"></span>'+statusLabel+'</div>'
      + '</div>';
  }

  function openPersonDrawer(key){
    var isNone = key === "__none__";
    var name = isNone ? "Não atribuído" : key;
    var items = personDemandas(key);
    var today = todayIso();
    var late = items.filter(function(d){ return d.date < today && d.status !== "concluido"; }).length;
    var done = items.filter(function(d){ return d.status === "concluido"; }).length;
    var statsHtml = '<div class="person-stats">'
      + '<div class="ps"><b>'+items.length+'</b>total</div>'
      + '<div class="ps late-c"><b>'+late+'</b>atrasadas</div>'
      + '<div class="ps done-c"><b>'+done+'</b>concluídas</div>'
      + '</div>';
    var filterBtn = '<button class="btn small ghost" id="btnFilterPerson" style="margin-top:10px;width:100%">Filtrar calendário nesta pessoa</button>';
    var listHtml = items.length ? items.map(renderPersonRow).join("") : '<div class="empty-note">Nenhuma pauta atribuída ainda.</div>';
    var sub = isNone ? "Pautas ainda sem responsável definido." : "Agenda de demandas e prazos.";
    openDrawer(name, sub, statsHtml + filterBtn + '<div style="margin-top:14px">' + listHtml + '</div>');
    document.querySelectorAll(".person-row").forEach(function(row){
      row.addEventListener("click", function(){ closeDrawer(); openModal(row.getAttribute("data-id")); });
    });
    var fb = document.getElementById("btnFilterPerson");
    if (fb) fb.addEventListener("click", function(){
      state.activeFilters = new Set([key]);
      closeDrawer(); renderTeamRow(); renderGrid(); renderList();
    });
  }

  // ---------------- Month nav ----------------
  document.getElementById("prevMonth").addEventListener("click", function(){
    state.month--; if (state.month < 0) { state.month = 11; state.year--; }
    renderAll();
  });
  document.getElementById("nextMonth").addEventListener("click", function(){
    state.month++; if (state.month > 11) { state.month = 0; state.year++; }
    renderAll();
  });
  document.getElementById("btnToday").addEventListener("click", function(){
    var t = new Date(); state.year = t.getFullYear(); state.month = t.getMonth(); renderAll();
  });

  // ---------------- Persistence (Firebase Firestore) ----------------
  var banner = document.getElementById("statusBanner");
  function showBanner(msg){ banner.textContent = msg; banner.classList.add("show"); }

  function persist(id, patch){
    if (!state.dbAvailable) return;
    updateDoc(doc(fdb, "demandas", id), patch).catch(function(e){ console.error(e); });
  }
  function persistCreate(id, payload){
    if (!state.dbAvailable) return;
    setDoc(doc(fdb, "demandas", id), payload).catch(function(e){ console.error(e); });
  }
  function persistDelete(id){
    if (!state.dbAvailable) return;
    deleteDoc(doc(fdb, "demandas", id)).catch(function(e){ console.error(e); });
  }

  function applySnapshot(snap){
    state.demandas = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    renderAll();
  }

  async function seedIfEmpty(){
    var demandasSnap = await getDocs(collection(fdb, "demandas"));
    if (demandasSnap.empty) {
      for (var i=0;i<SEED_DEMANDAS.length;i++) {
        var s = SEED_DEMANDAS[i];
        var body = { title: s.title, date: s.date, status: s.status, planoKey: s.planoKey, pracas: s.pracas, responsavel: s.responsavel, notas: s.notas };
        await setDoc(doc(fdb, "demandas", s.id), body);
      }
    }
    var planosSnap = await getDocs(collection(fdb, "planos"));
    if (planosSnap.empty) {
      var keys = Object.keys(SEED_PLANOS);
      for (var j=0;j<keys.length;j++) await setDoc(doc(fdb, "planos", keys[j]), SEED_PLANOS[keys[j]]);
    }
  }

  async function initDb(){
    if (!fdb) {
      showBanner("Firebase não configurado — edite o topo do arquivo com a configuração do seu projeto (veja LEIA-ME.md). Trabalhando localmente nesta sessão.");
      return;
    }
    try {
      await seedIfEmpty();
      var check = await getDocs(collection(fdb, "demandas"));
      if (check.empty) {
        showBanner("O Firebase respondeu, mas os dados não foram salvos — confira as regras do Firestore (veja LEIA-ME.md). Trabalhando localmente nesta sessão.");
        return;
      }
      state.dbAvailable = true;
      onSnapshot(collection(fdb, "planos"), function(snap){
        var planos = {};
        snap.forEach(function(d){ planos[d.id] = d.data(); });
        if (Object.keys(planos).length) { state.planos = planos; renderAll(); }
      }, function(err){ console.error(err); });
      onSnapshot(collection(fdb, "demandas"), applySnapshot, function(err){
        console.error(err);
        showBanner("Conexão instável com o banco — suas próximas edições podem não salvar.");
      });
      onSnapshot(collection(fdb, "autorizacoes"), function(snap){
        state.autorizacoes = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
        if (state.view === "auth") renderAuthList();
      }, function(err){ console.error(err); });
      onSnapshot(doc(fdb, "meta", "autorizacoes_sync"), function(snap){
        state.authSyncInfo = snap.exists() ? snap.data() : null;
        if (state.view === "auth") renderAuthList();
      }, function(err){ console.error(err); });
    } catch (e) {
      console.error(e);
      showBanner("Não foi possível conectar ao Firebase — confira a configuração e as regras do Firestore. Trabalhando localmente nesta sessão.");
    }
  }

  // ---------------- Boot ----------------
  state.demandas = SEED_DEMANDAS.map(function(s){
    var pracas = s.pracas != null ? s.pracas : (s.planoKey && SEED_PLANOS[s.planoKey] ? SEED_PLANOS[s.planoKey].pracas : []);
    return Object.assign({}, s, { pracas: pracas });
  });
  renderAll();
  initDb();
})();
</script>
</body>
</html>
